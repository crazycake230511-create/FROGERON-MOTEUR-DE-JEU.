name: Build et publier FROGERON

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Lier les export templates Godot
        run: |
          SRC=$(find / -type d -name "4.3.stable" -path "*export_templates*" 2>/dev/null | grep -v "^/github/home" | head -n 1)
          echo "Templates trouvés dans : $SRC"
          if [ -z "$SRC" ]; then echo "ERREUR : templates introuvables dans l'image"; exit 1; fi
          mkdir -p /github/home/.local/share/godot/export_templates
          ln -sfn "$SRC" /github/home/.local/share/godot/export_templates/4.3.stable

      - name: Importer les ressources Godot
        run: godot --headless --import

      - name: Préparer le dossier de sortie
        run: mkdir -p build/web

      - name: Exporter le projet pour le web
        run: godot --headless --verbose --export-release "Web"

      - name: Assembler le site
        run: |
          mkdir -p _site/game
          cp -r build/web/. _site/game/
          [ -d editor ] && mkdir -p _site/editor && cp -r editor/. _site/editor/ || true
          [ -f site/index.html ] && cp site/index.html _site/index.html || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
